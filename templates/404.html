{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-20 text-center">
    <div class="relative mb-8">
        <h1 class="text-[12rem] font-black text-white/5 select-none">404</h1>
        <div class="absolute inset-0 flex items-center justify-center">
            <span class="text-6xl animate-bounce">🛸</span>
        </div>
    </div>
    
    <h2 class="text-3xl font-bold text-white mb-4">Lost in Space?</h2>
    <p class="text-gray-400 max-w-md mx-auto mb-10">
        The page you are looking for doesn't exist or has been moved to another dimension.
    </p>

    <div class="flex gap-4">
        <a href="{% url 'dashboard' %}" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold transition-all shadow-lg shadow-blue-600/20">
            Go to Dashboard
        </a>
        <a href="{% url 'support' %}" class="px-8 py-3 glass border border-white/10 hover:bg-white/5 text-gray-300 rounded-xl font-bold transition-all">
            Report Issue
        </a>
    </div>
</div>
{% endblock %}
