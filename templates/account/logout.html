{% extends "base.html" %}
{% load i18n %}

{% block title %}Logout - Linkify Media{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-12">

    <div class="glass w-full max-w-md p-8 rounded-2xl shadow-2xl text-center">

        <div class="mb-6">
            <div class="w-20 h-20 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
            </div>
            <h2 class="text-3xl font-semibold mb-2">
                Signing Out?
            </h2>
            <p class="text-gray-400">
                Are you sure you want to sign out of your account?
            </p>
        </div>

        <form method="POST" action="{% url 'account_logout' %}" class="space-y-4">
            {% csrf_token %}
            
            {% if redirect_field_value %}
                <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
            {% endif %}

            <!-- Logout Button -->
            <button type="submit"
                class="w-full py-3 rounded-lg bg-gradient-to-r from-red-500 to-pink-600 
                hover:scale-[1.02] transition-all duration-300 shadow-lg font-semibold">
                Yes, Sign Me Out
            </button>

            <!-- Cancel Button -->
            <a href="javascript:history.back()"
                class="block w-full py-3 rounded-lg bg-gray-700/50 hover:bg-gray-700 
                transition-all duration-300 text-gray-300 font-medium">
                Cancel
            </a>
        </form>

    </div>
</div>
{% endblock %}
