{% extends "base.html" %}
{% load i18n %}

{% block title %}Check Your Inbox - Linkify Media{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16"><div class="w-full max-w-md rounded-3xl border border-emerald-500/20 bg-slate-900/80 p-8 text-center shadow-2xl"><div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-emerald-500/10"><i class="fa-solid fa-envelope-circle-check text-2xl text-emerald-300"></i></div><h1 class="mt-6 text-2xl font-bold text-white">Check your inbox</h1><p class="mt-3 text-sm leading-relaxed text-slate-400">If an account exists for that email, we sent a secure reset link. Check your spam folder if it does not arrive shortly.</p><a href="{% url 'account_login' %}" class="mt-7 inline-flex rounded-xl bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-500">Back to sign in</a></div></div>
{% endblock %}
