{% extends "base.html" %}
{% load i18n %}

{% block title %}Sign-in Cancelled - Linkify Media{% endblock %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md rounded-3xl border border-amber-500/20 bg-slate-900/80 p-8 text-center shadow-2xl">
    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-amber-500/10"><i class="fa-solid fa-arrow-rotate-left text-2xl text-amber-300"></i></div>
    <h1 class="mt-6 text-2xl font-bold text-white">Sign-in cancelled</h1>
    <p class="mt-3 text-sm leading-relaxed text-slate-400">No account changes were made. You can try the provider again or continue with email and password.</p>
    <a href="{% url 'account_login' %}" class="mt-7 inline-flex rounded-xl bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-500">Return to sign in</a>
  </div>
</div>
{% endblock %}
