{% load socialaccount %}
<div class="space-y-3">
  {% for provider in providers %}
    <a href="{% provider_login_url provider.id process=process|default:'login' %}" class="flex w-full items-center justify-center gap-3 rounded-xl border border-slate-700 bg-slate-950/60 px-5 py-3 font-semibold text-white transition hover:border-indigo-500/50"><i class="fa-brands fa-{{ provider.id }} text-lg text-indigo-300"></i>Continue with {{ provider.name }}</a>
  {% endfor %}
</div>
