{% extends "base.html" %}
{% block title %}API Reference - Linkify Media{% endblock %}
{% block content %}<div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8"><div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between"><div><span class="text-xs font-semibold uppercase tracking-[.2em] text-indigo-400">Build faster</span><h1 class="mt-3 text-4xl font-bold text-white">Interactive API reference.</h1><p class="mt-3 text-slate-400">Explore endpoints, schemas, authentication headers, and live request examples.</p></div><a href="{% url 'playground' %}" class="inline-flex items-center rounded-xl border border-slate-700 px-4 py-2.5 text-sm font-semibold text-slate-300 hover:border-indigo-500">Open playground <i class="fa-solid fa-arrow-right ml-2"></i></a></div><div class="mt-8 overflow-hidden rounded-3xl border border-slate-800 bg-white"><div id="swagger-ui"></div></div></div>{% endblock %}
{% block extra_js %}<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"><script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script><script>window.onload=()=>SwaggerUIBundle({url:'{{ schema_url }}',dom_id:'#swagger-ui',deepLinking:true,presets:[SwaggerUIBundle.presets.apis,SwaggerUIBundle.SwaggerUIStandalonePreset],layout:'BaseLayout'});</script>{% endblock %}
