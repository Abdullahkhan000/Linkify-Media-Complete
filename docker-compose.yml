services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: linkify-media-frontend:latest
    environment:
      DJANGO_INTERNAL_URL: http://web:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkify-media:latest
    env_file:
      - .env
    environment:
      SQLITE_DB_PATH: /app/data/db.sqlite3
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,web}"
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - sqlite_data:/app/data
      - staticfiles:/app/staticfiles
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/api/ready/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sqlite_data:
  staticfiles:
  redis_data:
